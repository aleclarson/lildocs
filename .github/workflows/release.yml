name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Explicit version to release, such as 0.1.0 or v0.1.0.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main')
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install git-cliff
        uses: taiki-e/install-action@6bc589fbc0c06e6af5e11e92701751889fdaa48c
        with:
          tool: git-cliff

      - name: Resolve release version
        id: version
        env:
          VERSION_OVERRIDE: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail
          current_version="$(node -p "require('./package.json').version")"

          if [ -n "$VERSION_OVERRIDE" ]; then
            next_version="${VERSION_OVERRIDE#v}"
            if ! node -e "process.exit(/^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(process.argv[1]) ? 0 : 1)" "$next_version"; then
              echo "Invalid version override: $VERSION_OVERRIDE" >&2
              exit 1
            fi
            echo "Using explicit version override: $next_version"
          else
            next_version="$(git-cliff --bumped-version | sed 's/^v//')"
          fi

          if [ -z "$next_version" ]; then
            echo "git-cliff did not infer a version" >&2
            exit 1
          fi

          if [ -z "$VERSION_OVERRIDE" ] && [ "$next_version" = "$current_version" ]; then
            echo "git-cliff inferred $next_version, which matches package.json; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse --verify --quiet "v$next_version" >/dev/null; then
            echo "Release tag v$next_version already exists" >&2
            exit 1
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$next_version" >> "$GITHUB_OUTPUT"

  pack:
    name: Pack release
    runs-on: ubuntu-latest
    needs: resolve
    if: needs.resolve.outputs.should_release == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump package version
        run: npm pkg set version="${{ needs.resolve.outputs.version }}"

      - name: Build package
        run: pnpm run build

      - name: Check package contents
        run: npm publish --dry-run

      - name: Pack release tarball
        run: npm pack

      - name: Upload release tarball
        uses: actions/upload-artifact@v5
        with:
          name: release-package
          path: lildocs-${{ needs.resolve.outputs.version }}.tgz
          if-no-files-found: error

  commit-release:
    name: Commit release
    runs-on: ubuntu-latest
    needs:
      - resolve
      - pack
    if: needs.resolve.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Bump package version
        run: npm pkg set version="${{ needs.resolve.outputs.version }}"

      - name: Commit release updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add package.json
          if git diff --cached --quiet; then
            git commit --allow-empty -m "chore(release): ${{ needs.resolve.outputs.tag }}"
          else
            git commit -m "chore(release): ${{ needs.resolve.outputs.tag }}"
          fi
          git tag "${{ needs.resolve.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ needs.resolve.outputs.tag }}"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs:
      - resolve
      - commit-release
    if: needs.resolve.outputs.should_release == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download release tarball
        uses: actions/download-artifact@v6
        with:
          name: release-package

      - name: Publish to npm with provenance
        run: npm publish "lildocs-${{ needs.resolve.outputs.version }}.tgz" --provenance --access public
